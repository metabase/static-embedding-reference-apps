<!doctype html>
<!--
A minimal example of a public embed: a public link to a question in an iframe.

A public embed doesn't involve a signed token, so anyone with the link can see the data.
To restrict data, use a guest embed instead. Please see:

    https://www.metabase.com/docs/latest/embedding/public-links#public-embeds

for the full docs.

The `src` below is a public link from the demo Metabase in this repository. To embed from your
own Metabase, change it to one of your public links.

To try it, serve this directory with a web server, for example:

    python3 -m http.server 8002

and open http://localhost:8002 in your browser.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Metabase public embed</title>
  </head>
  <body>
    <h1>Metabase public embed</h1>
    <iframe
      src="http://localhost:3000/public/question/938a446c-da62-479a-a1bd-913cd29a77ef"
      title="A public question"
      width="600"
      height="400"
    ></iframe>
  </body>
</html>
