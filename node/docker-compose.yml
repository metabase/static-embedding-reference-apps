services:
  metabase:
    image: metabase/metabase-enterprise:v1.54.9
    container_name: metabase_signed_app_embedding_demo
    hostname: metabase
    ports:
      - 3000:3000
    environment: 
      MB_SITE_URL: http://localhost:3000
      MB_EMBEDDING_APP_ORIGIN: "*"
      MB_ENABLE_EMBEDDING: true
      MB_EMBEDDING_SECRET_KEY: a1c0952f3ff361f1e7dd8433a0a50689a004317a198ecb0a67ba90c73c27a958
      MB_ENABLE_PUBLIC_SHARING: true
    networks: 
      - metanet1
    volumes:
      - ../metabase:/metabase.db
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2048M
        reservations:
          cpus: '1'
          memory: 2048M
  node_signed_app_embedding_demo:
    build: .
    container_name: webapp_signed_app_embedding_demo
    hostname: webapp
    ports:
      - 8080:8080
    networks:
      - metanet1
    environment:
      METABASE_URL: http://localhost:3000
      PORT: 8080
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '1'
          memory: 256M
networks: 
  metanet1:
    driver: bridge