services:
  metabase:
    image: metabase/metabase-enterprise:v1.65.6.2
    ports:
      - 3000:3000
    environment:
      - "MB_SITE_URL=http://localhost:3000"
      - "MB_ENABLE_EMBEDDING_MODULAR=true"
      - "MB_EMBEDDING_SECRET_KEY=a1c0952f3ff361f1e7dd8433a0a50689a004317a198ecb0a67ba90c73c27a958"
      - "MB_ENABLE_PUBLIC_SHARING=true"
      - "JAVA_OPTS=-Xmx1g"
    volumes:
      - ../metabase:/metabase.db
    cpus: 1
    mem_limit: 2048mb
  webapp:
    build: .
    ports:
      - 8080:8080
    environment:
      # The URL people's browsers use to reach Metabase.
      - "METABASE_SITE_URL=http://localhost:3000"
      # The same key as MB_EMBEDDING_SECRET_KEY above.
      - "METABASE_SECRET_KEY=a1c0952f3ff361f1e7dd8433a0a50689a004317a198ecb0a67ba90c73c27a958"
